# PayLight on a single VPS: Postgres + web + worker + Caddy (automatic HTTPS).
# Usage (on the server, in the repo root):  cp deploy/.env.example deploy/.env  # fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: paylight

# Cap Docker's log files so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: paylight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: paylight
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylight"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: .., args: { NEXT_PUBLIC_SUPPORT_TELEGRAM: "${NEXT_PUBLIC_SUPPORT_TELEGRAM:-https://t.me/}" } }
    image: paylight:latest
    command: ["pnpm", "db:migrate"]
    env_file: .env
    environment: { DATABASE_URL: "postgresql://paylight:${POSTGRES_PASSWORD}@db:5432/paylight" }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    image: paylight:latest
    restart: unless-stopped
    logging: *logging
    command: ["pnpm", "--filter", "@paylight/web", "start"]
    env_file: .env
    environment: { DATABASE_URL: "postgresql://paylight:${POSTGRES_PASSWORD}@db:5432/paylight", PORT: "3000" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      retries: 5

  worker:
    image: paylight:latest
    restart: unless-stopped
    logging: *logging
    command: ["pnpm", "--filter", "@paylight/worker", "start"]
    env_file: .env
    environment: { DATABASE_URL: "postgresql://paylight:${POSTGRES_PASSWORD}@db:5432/paylight", PORT: "8080" }
    depends_on: { migrate: { condition: service_completed_successfully } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
